name: Native mobile builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/**', 'android/**', 'ios/**', 'package*.json', 'capacitor.config.json', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build:web
      - run: npm test && npm run check && npm audit --audit-level=high
      - run: deno check --config supabase/functions/deno.json supabase/functions/game-api/index.ts
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/game-api/index.test.ts
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run mobile:sync -- android
      - name: Build installable test APK and release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Brick-Breaker-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync -- ios
      - name: Validate opaque App Store icon
        run: node -e "const b=require('fs').readFileSync('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png');if(b[25]!==2)throw Error('The iOS icon must use RGB without an alpha channel')"
      - name: Build unsigned device archive for Apple signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/BrickBreaker.xcarchive
          CODE_SIGNING_ALLOWED=NO archive
      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator
          CODE_SIGNING_ALLOWED=NO build
      - name: Validate bundled privacy manifest
        run: |
          test -f build/BrickBreaker.xcarchive/Products/Applications/App.app/PrivacyInfo.xcprivacy
          plutil -lint build/BrickBreaker.xcarchive/Products/Applications/App.app/PrivacyInfo.xcprivacy
      - name: Package native iOS deliverables
        run: |
          ditto -c -k --keepParent build/BrickBreaker.xcarchive build/BrickBreaker-iOS-unsigned-archive.zip
          ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/App.app build/BrickBreaker-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Brick-Breaker-iOS
          path: |
            build/BrickBreaker-iOS-unsigned-archive.zip
            build/BrickBreaker-iOS-simulator.zip
          if-no-files-found: error
