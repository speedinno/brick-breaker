<!doctype html><meta charset="utf-8"><title>Rewarded ad local verification</title>
<style>body{margin:18px;background:#14171c;color:#eee;font:15px system-ui;display:flex;gap:20px;align-items:flex-start}iframe{width:393px;height:852px;border:1px solid #67615b;border-radius:16px}pre{max-width:540px;white-space:pre-wrap;line-height:1.7}button{padding:14px;border-radius:10px}</style>
<iframe title="Actual game with local ad SDK mock"></iframe><main><h1>Voluntary reward flow</h1><p>Scripted local SDK callbacks + real PostgreSQL. No real ad, money or provider account.</p><pre id="result">Starting…</pre><button id="continue" hidden>Continue local verification</button></main>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),checks=[],$=id=>frame.contentDocument?.getElementById(id),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(ok,message)=>{if(!ok)throw Error(message);};
async function until(work,message){for(let n=0;n<400;n++){if(work())return;await pause(50);}throw Error(message);}
async function request(action,body={}){const response=await fetch('/__time-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountId:'11111111-1111-4111-8111-111111111111',...body})});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
function record(message){checks.push(message);out.textContent='Running…\n'+checks.join('\n');}
const original=Object.keys(localStorage).filter(k=>k.startsWith('brick-breaker-')).map(k=>[k,localStorage.getItem(k)]);
try{
 for(const [key]of original)localStorage.removeItem(key);localStorage.setItem('brick-breaker-help-seen-v1','true');await request('qa-reset',{ads:true,milliseconds:0});
 const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/__rewarded-game';await loaded;await until(()=>$('homePlay')&&!$('homePlay').disabled,'Game failed to boot');
 $('homeAccount').click();$('accountEmail').value='time-test@example.test';$('signInForm').requestSubmit();await until(()=>!$('codePanel').hidden,'Code form missing');$('accountCode').value='12345678';$('verifyForm').requestSubmit();await until(()=>!$('signedInPanel').hidden&&!$('homePlay').disabled&&$('accountMessage').textContent.includes('Signed in.'),'Sign in failed');frame.contentDocument.querySelector('#account [data-close]').click();
 $('homePlay').click();await until(()=>$('home').hidden&&!frame.contentDocument.querySelector('dialog[open]'),'Game not visible');$('launch').click();$('auto').click();
 await until(()=>!$('adPrepare').hidden&&!$('adRefresh').disabled,'Ads did not load');assert($('adPrepare').disabled,'Ad eligible before adult confirmation');assert(!$('qaAd'),'Ad opened without consent');$('adAdult').checked=true;$('adAdult').dispatchEvent(new Event('change'));$('adPrepare').click();
 await until(()=>!$('adWatch').hidden&&!$('adWatch').disabled,'Offer did not become ready');assert(!$('qaAd'),'Preparing an offer opened an ad');assert($('adWatch').textContent.includes('30 seconds'),'Original promise not visible');assert((await request('ad-state')).remaining===2,'Opportunity not reserved');record('Preparing shows the exact 30-second promise; no ad or credit opens automatically');
 $('adCancel').click();await until(()=>$('adMessage').textContent.includes('Ad cancelled.'),'Cancellation unfinished');assert((await request('ad-state')).remaining===3,'Unopened offer did not release its slot');assert((await request('time-state')).availableMs===0,'Cancellation credited time');record('Cancelling before presentation returns the opportunity without granting time');
 $('adPrepare').click();await until(()=>!$('adWatch').hidden&&!$('adWatch').disabled,'Second offer unavailable');$('adWatch').scrollIntoView({block:'center'});
 if(new URL(location.href).searchParams.has('review')){document.querySelector('#continue').hidden=false;await new Promise(resolve=>document.querySelector('#continue').onclick=resolve);document.querySelector('#continue').hidden=true;}
 $('adWatch').click();await until(()=>$('qaAd'),'Final click did not show mock ad');assert(!$('assist').open,'Native dialog hid external ad');assert($('promptTitle').textContent==='Paused.','Game not paused beneath ad');assert((await request('time-state')).availableMs===0,'Opening ad credited time');
 const key='brick-breaker-session-v3:user:11111111-1111-4111-8111-111111111111',before=JSON.parse(localStorage.getItem(key)).stageTime;await pause(180);frame.contentWindow.dispatchEvent(new Event('pagehide'));assert(JSON.parse(localStorage.getItem(key)).stageTime===before,'Game ran beneath ad');record('Only the final Watch click opens external UI, with gameplay paused and no premature grant');
 $('qaAdComplete').click();await until(()=>$('adMessage').textContent.includes('Reward verified:'),'Completion not verified');assert((await request('time-state')).availableMs===30000,'Duplicate callback did not grant exactly once');assert($('assist').open,'Time bank did not return after dismissal');assert($('auto').getAttribute('aria-pressed')!=='true','Reward automatically started autoplay');record('Two mock completion callbacks grant exactly 30,000ms once through the real ledger; autoplay stays off');
 $('adRecover').click();await until(()=>$('adMessage').textContent.includes('bank is up to date'),'Recovery not finished');assert((await request('time-state')).availableMs===30000,'Recovery duplicated credit');
 $('adPrepare').click();await until(()=>!$('adWatch').hidden&&!$('adWatch').disabled,'Dismissal offer unavailable');$('adWatch').click();await until(()=>$('qaAdDismiss'),'Dismissal mock missing');$('qaAdDismiss').click();await until(()=>$('adMessage').textContent.includes('Ad cancelled.'),'Early dismissal not final');assert((await request('time-state')).availableMs===30000,'Dismissal granted time');assert((await request('ad-state')).remaining===2,'Definitively unearned H5 ad held a slot');record('Recovery adds no duplicate credit; an early H5 dismissal grants nothing and releases its slot');
 $('adPrepare').click();await until(()=>!$('adWatch').hidden&&!$('adWatch').disabled,'Background offer unavailable');frame.contentWindow.dispatchEvent(new Event('blur'));assert($('adWatch').hidden&&!$('qaAd'),'Background retained a ready ad');$('adRecover').click();await until(()=>$('adMessage').textContent.includes('bank is up to date'),'Unopened background offer not recovered');assert((await request('ad-state')).remaining===2,'Background offer consumed an opportunity');record('Leaving the game invalidates an unopened offer; explicit recovery returns its slot');
 out.textContent='PASS · '+checks.length+' checks\n'+checks.join('\n');
}catch(error){out.textContent='FAIL · '+error.message+'\n'+checks.join('\n')+'\nAd: '+($('adMessage')?.textContent||'')+'\nStatus: '+($('adStatus')?.textContent||'');console.error(error);}
finally{const blank=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='about:blank';await blank;for(const key of Object.keys(localStorage))if(key.startsWith('brick-breaker-'))localStorage.removeItem(key);for(const [key,value]of original)localStorage.setItem(key,value);}
</script>
