<!doctype html><meta charset="utf-8"><title>Account deletion recovery integration</title>
<style>body{background:#14171c;color:#eee;font:14px system-ui;margin:20px}iframe{width:393px;height:852px;border:0}pre{white-space:pre-wrap;max-width:730px}</style>
<h1>Account deletion recovery integration</h1><p>Actual application and deletion orchestration with disposable local PostgreSQL. Authentication and provider identity are fixtures. No real account or provider deletion.</p><pre id="result">Running…</pre><iframe title="Account deletion test game" src="about:blank"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),checks=[],$=id=>frame.contentDocument?.getElementById(id),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)),owner='11111111-1111-4111-8111-111111111111';
const assert=(condition,message)=>{if(!condition)throw Error(message);};async function until(fn,message){for(let n=0;n<800;n++){if(fn())return;await pause(25);}throw Error(message);}
async function request(action,body={}){const response=await fetch('/__time-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountId:owner,...body})});const value=await response.json();if(!response.ok)throw Error(value.error);return value;}
function record(text){checks.push(text);out.textContent='Running…\n'+checks.join('\n');}
const original=Object.keys(localStorage).filter(k=>k.startsWith('brick-breaker-')).map(k=>[k,localStorage.getItem(k)]);
try{
 for(const [key]of original)localStorage.removeItem(key);localStorage.setItem('brick-breaker-help-seen-v1','true');const {emptyProgress,markCompleted}=await import('/progress.js');const guestFixture=markCompleted(markCompleted(emptyProgress(),1,{score:1200,seconds:24,peak:4,stageLosses:0}),4,{score:1900,seconds:32,peak:7,stageLosses:1});localStorage.setItem('brick-breaker-v3:guest',JSON.stringify(guestFixture));await request('qa-reset',{privacy:true,milliseconds:0});
 const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/__time-game';await loaded;await until(()=>$('homePlay')&&!$('homePlay').disabled,'Game boot failed');
 $('homeAccount').click();$('accountEmail').value='time-test@example.test';$('signInForm').requestSubmit();await until(()=>!$('codePanel').hidden,'Code panel missing');$('accountCode').value='12345678';$('verifyForm').requestSubmit();await until(()=>!$('signedInPanel').hidden&&!$('homePlay').disabled&&$('accountMessage').textContent.includes('Signed in.'),'Sign-in did not finish');
 const {accountStorageKeys}=await import('/account-privacy.js');for(const key of accountStorageKeys(owner))if(!localStorage.getItem(key))localStorage.setItem(key,JSON.stringify({privateFixture:true}));const guest=localStorage.getItem('brick-breaker-v3:guest'),device=localStorage.getItem('brick-breaker-device-v1');record('Actual account flow signs into the disposable fixture; guest save is separate');
 $('requestDelete').click();$('deleteConfirm').value='DELETE';$('deleteForm').requestSubmit();await until(()=>!$('deleteDialog').open&&$('accountMessage').textContent.includes('Provider cleanup is queued'),'Deletion did not finish: '+$('deleteError').textContent);assert($('signedInPanel').hidden,'Deleted identity still signed in');for(const key of accountStorageKeys(owner))assert(localStorage.getItem(key)===null,'Account journal survived: '+key);assert(localStorage.getItem('brick-breaker-deletions-v1')===null,'Completed device cleanup kept its receipt');record('Confirmed deletion signs out and removes account saves, field snapshot and purchase/ad/recovery journals');
 // Returning to the guest field deliberately updates its last-played timestamp.
 // Every progress, score, mastery, selected-stage and pending-save field must
 // remain identical to the nonempty guest save captured before deletion.
 const withoutPlayTime=text=>JSON.stringify({...JSON.parse(text),updatedAt:0});assert(withoutPlayTime(localStorage.getItem('brick-breaker-v3:guest'))===withoutPlayTime(guest),'Guest progress changed');assert(localStorage.getItem('brick-breaker-device-v1')===device,'Device identity changed');assert(!$('accountEmail').value&&!$('accountCode').value&&!$('passwordEmail').value&&!$('accountPassword').value,'Private form fields survived');record('Nonempty guest progress, score and mastery survive (last-played timestamp advances); private account fields clear');
 const jobs=await request('qa-privacy-jobs');assert(jobs.length===2&&jobs.some(j=>j.state==='pending')&&jobs.some(j=>j.state==='manual_review'),'Durable provider/SMTP jobs missing');assert(jobs.every(j=>j.has_subject),'Cleanup was prematurely called complete');record('Real PostgreSQL transaction queues RevenueCat cleanup and email-retention review; UI says queued');
 out.textContent='PASS · '+checks.length+' grouped checks\n\n'+checks.join('\n');out.dataset.state='pass';
}catch(error){out.textContent='FAIL: '+error.message+'\n'+checks.join('\n');out.dataset.state='fail';}
finally{frame.src='about:blank';await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));for(const key of Object.keys(localStorage))if(key.startsWith('brick-breaker-'))localStorage.removeItem(key);for(const [key,value]of original)localStorage.setItem(key,value);}
</script>
