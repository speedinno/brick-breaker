<!doctype html><meta charset="utf-8"><title>Owned-web checkout integration</title>
<style>body{background:#14171c;color:#eee;font:14px system-ui;margin:20px}iframe{width:393px;height:852px;border:0}pre{white-space:pre-wrap;max-width:700px}button{min-height:44px}</style>
<h1>Owned-web checkout integration</h1><p>Actual application + production verification/orchestration + real local PostgreSQL. Authentication, payment SDK and provider API are local mocks. No real payment or provider sandbox claim.</p><pre id="result">Running…</pre><button id="continue" hidden>Continue local verification</button><iframe title="Web checkout test game" src="about:blank"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),checks=[],$=id=>frame.contentDocument?.getElementById(id),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(condition,message)=>{if(!condition)throw Error(message);};async function until(fn,message){for(let n=0;n<600;n++){if(fn())return;await pause(25);}throw Error(message);}
async function request(action,body={}){const response=await fetch('/__time-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountId:'11111111-1111-4111-8111-111111111111',...body})});const value=await response.json();if(!response.ok)throw Error(value.error);return value;}
function record(text){checks.push(text);out.textContent='Running…\n'+checks.join('\n');}
const original=Object.keys(localStorage).filter(k=>k.startsWith('brick-breaker-')).map(k=>[k,localStorage.getItem(k)]);
try{
 for(const [key]of original)localStorage.removeItem(key);localStorage.setItem('brick-breaker-help-seen-v1','true');await request('qa-reset',{commerce:true,milliseconds:0});
 const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/__commerce-game';await loaded;await until(()=>$('homePlay')&&!$('homePlay').disabled,'Game boot failed');
 $('homeAccount').click();$('accountEmail').value='time-test@example.test';$('signInForm').requestSubmit();await until(()=>!$('codePanel').hidden,'Code panel missing');$('accountCode').value='12345678';$('verifyForm').requestSubmit();
 await until(()=>!$('signedInPanel').hidden&&!$('homePlay').disabled&&$('accountMessage').textContent.includes('Signed in.'),'Sign-in did not finish');frame.contentDocument.querySelector('#account [data-close]').click();$('homePlay').click();await until(()=>$('home').hidden&&!frame.contentDocument.querySelector('dialog[open]'),'Game not visible');$('launch').click();$('auto').click();
 await until(()=>frame.contentDocument.querySelector('#purchaseOffers button')&&!frame.contentDocument.querySelector('#purchaseOffers button').disabled,'Web pack did not load');assert((await request('time-state')).availableMs===0,'Initial bank is not empty');
 frame.contentDocument.querySelector('#purchaseOffers button').click();await until(()=>!$('purchaseQuote').hidden&&!$('purchaseConfirm').disabled,'Quote not shown');assert($('purchaseQuoteDetails').textContent.includes('129'),'Actual quote price not shown');assert(!$('qaCheckout'),'Price check opened payment automatically');record('Actual price review appears before any payment window opens');
 if(new URL(location.href).searchParams.has('review')){const button=document.querySelector('#continue');button.hidden=false;await new Promise(resolve=>button.onclick=resolve);button.hidden=true;}
 $('purchaseConfirm').click();await until(()=>$('qaCheckout'),'Explicit checkout did not open');assert(!$('assist').open&&$('promptTitle').textContent==='Paused.','Checkout did not expose the paused game safely');const snapshotKey='brick-breaker-session-v3:user:11111111-1111-4111-8111-111111111111',before=JSON.parse(localStorage.getItem(snapshotKey)).stageTime;await pause(150);frame.contentWindow.dispatchEvent(new Event('pagehide'));assert(JSON.parse(localStorage.getItem(snapshotKey)).stageTime===before,'Gameplay advanced beneath checkout');assert((await request('time-state')).availableMs===0,'Opening checkout granted time');record('Explicit confirmation opens the local SDK mock with no unverified credit');
 $('qaCompletePayment').click();await until(()=>$('purchaseMessage').textContent.includes('Purchase verified.'),'Captured purchase not verified');assert((await request('time-state')).availableMs===300000,'Exact pack was not credited');record('Canonical mock-provider capture and real PostgreSQL grant exactly 300,000ms once');
 $('purchaseRecover').click();await until(()=>$('purchaseMessage').textContent.includes('balance is synchronized'),'Purchase recovery not finished');assert((await request('time-state')).availableMs===300000,'Recovery refilled or duplicated credit');
 await until(()=>!$('assist15000').disabled,'Activation unavailable after purchase');$('assist15000').click();await until(()=>$('auto').getAttribute('aria-pressed')==='true','Purchased assistance not active');await pause(500);
 const target=$('saveStatus');target.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown',{pointerType:'touch',pointerId:81,bubbles:true,cancelable:true,clientX:20,clientY:90}));target.dispatchEvent(new frame.contentWindow.PointerEvent('pointerup',{pointerType:'touch',pointerId:81,bubbles:true,cancelable:true,clientX:20,clientY:90}));
 let used;for(let n=0;n<200;n++){used=await request('time-state');if(!used.reservedMs)break;await pause(25);}assert(used.availableMs<300000&&used.availableMs>298000,'Partial real-time spending was incorrect');record('Purchased time runs the ordinary controller, then manual takeover preserves its remainder');
 $('auto').click();await until(()=>!$('purchaseRecover').hidden&&!$('purchaseRecover').disabled,'Recovery did not load');$('purchaseRecover').click();await until(()=>$('purchaseMessage').textContent.includes('balance is synchronized'),'Final recovery unfinished');assert((await request('time-state')).availableMs===used.availableMs,'Consumed time was replenished');record('Restoring after actual gameplay does not refill the consumed pack');out.textContent='PASS · '+checks.length+' checks\n'+checks.join('\n');
}catch(error){out.textContent='FAIL · '+error.message+'\n'+checks.join('\n')+'\nPurchase: '+($('purchaseMessage')?.textContent||'')+'\nStatus: '+($('purchaseStatus')?.textContent||'');console.error(error);}
finally{const blank=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='about:blank';await blank;for(const key of Object.keys(localStorage))if(key.startsWith('brick-breaker-'))localStorage.removeItem(key);for(const [key,value]of original)localStorage.setItem(key,value);}
</script>
