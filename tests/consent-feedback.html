<!doctype html><meta charset="utf-8"><title>Consent and reward integration</title>
<style>body{margin:18px;background:#14171c;color:#eee;font:15px system-ui;display:flex;gap:20px;align-items:flex-start}iframe{width:393px;height:852px;border:1px solid #67615b;border-radius:16px}pre{max-width:540px;white-space:pre-wrap;line-height:1.7}</style>
<iframe title="Actual game with local CMP mock"></iframe><main><h1>Consent before an optional ad</h1><p>Actual bridge and game, mock Google callbacks, real PostgreSQL. No real ad or consent submission.</p><pre id="result">Starting…</pre></main>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),checks=[],$=id=>frame.contentDocument?.getElementById(id),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(ok,message)=>{if(!ok)throw Error(message);};
async function until(work,message){for(let n=0;n<400;n++){if(work())return;await pause(50);}throw Error(message);}
async function request(action,body={}){const response=await fetch('/__time-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountId:'11111111-1111-4111-8111-111111111111',...body})});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
function record(message){checks.push(message);out.textContent='Running…\n'+checks.join('\n');}
const original=Object.keys(localStorage).filter(k=>k.startsWith('brick-breaker-')).map(k=>[k,localStorage.getItem(k)]);
try{
 for(const [key]of original)localStorage.removeItem(key);localStorage.setItem('brick-breaker-help-seen-v1','true');await request('qa-reset',{ads:true,milliseconds:0});
 const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/__consent-game';await loaded;await until(()=>$('homePlay')&&!$('homePlay').disabled,'Game failed to boot');
 assert(!$('qaConsent'),'Guest launch opened an unsolicited privacy form');$('homeAccount').click();$('accountEmail').value='time-test@example.test';$('signInForm').requestSubmit();await until(()=>!$('codePanel').hidden,'Code form missing');$('accountCode').value='12345678';$('verifyForm').requestSubmit();await until(()=>!$('signedInPanel').hidden&&!$('homePlay').disabled&&$('accountMessage').textContent.includes('Signed in.'),'Sign in failed');frame.contentDocument.querySelector('#account [data-close]').click();
 $('homePlay').click();await until(()=>$('home').hidden&&!frame.contentDocument.querySelector('dialog[open]'),'Game not visible');$('launch').click();$('auto').click();await until(()=>!$('adPrepare').hidden&&!$('adRefresh').disabled,'Ads did not load');assert(!$('qaConsent')&&!$('qaAd'),'Catalog check loaded unsolicited UI');$('adAdult').checked=true;$('adAdult').dispatchEvent(new Event('change'));$('adPrepare').click();
 await until(()=>$('qaConsent'),'Actual bridge did not show mock privacy form');assert(!$('assist').open&&$('promptTitle').textContent==='Paused.','Privacy form covered by game dialog or game unpaused');assert(!$('qaAd'),'Ad opened before a privacy decision');record('Guest play and catalog checks load no privacy form or ad; deliberate preparation pauses and exposes the form');
 $('qaConsentDeny').click();await until(()=>$('adMessage').textContent.includes('privacy choices'),'Denial did not stop preparation');assert((await request('ad-state')).remaining===3,'Denied consent consumed a daily opportunity');assert((await request('time-state')).availableMs===0,'Consent denial granted time');assert($('assist').open,'Time bank did not return after privacy form');record('Declining consent opens no ad, grants nothing and returns the unused opportunity');
 await until(()=>!$('adPrivacy').hidden&&!$('adPrivacy').disabled,'European choices entry missing');$('adPrivacy').click();await until(()=>$('qaConsent'),'European choices did not reopen the actual bridge');assert(!$('assist').open,'Game dialog hides consent changes');await pause(150);assert($('qaConsent')&&!$('assist').open,'Game returned while privacy form remained open');record('The privacy entry reopens the form and waits for actual dismissal');
 $('qaConsentAllow').click();await until(()=>$('adMessage').textContent.includes('Privacy choices updated.'),'Consent change did not return');assert(!$('qaAd')&&$('adWatch').hidden,'Granting consent automatically opened or prepared an ad');$('adPrepare').click();await until(()=>!$('adWatch').hidden&&!$('adWatch').disabled,'A newly granted choice did not permit fresh preparation');assert(!$('qaConsent')&&!$('qaAd'),'A remembered choice opened unsolicited UI');record('Granting consent starts no ad; a new deliberate preparation rechecks the current signals');
 $('adCancel').click();await until(()=>$('adMessage').textContent.includes('Ad cancelled.'),'Unopened ad did not cancel');assert((await request('ad-state')).remaining===3,'Final cancellation lost an opportunity');record('The consent-approved unopened offer remains optional and returns its slot on cancellation');out.textContent='PASS · '+checks.length+' checks\n'+checks.join('\n');
}catch(error){out.textContent='FAIL · '+error.message+'\n'+checks.join('\n')+'\nAd: '+($('adMessage')?.textContent||'');console.error(error);}
finally{const blank=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='about:blank';await blank;for(const key of Object.keys(localStorage))if(key.startsWith('brick-breaker-'))localStorage.removeItem(key);for(const [key,value]of original)localStorage.setItem(key,value);}
</script>
