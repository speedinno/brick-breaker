<!doctype html><meta charset="utf-8"><title>Optional play analytics integration</title>
<style>body{background:#14171c;color:#eee;font:14px system-ui;margin:20px}iframe{width:393px;height:852px;border:0}pre{white-space:pre-wrap;max-width:730px}button{min-height:44px}</style>
<h1>Optional play analytics integration</h1><p>Actual application and account metrics with disposable local PostgreSQL. Auth is a fixture. No real player telemetry or provider account is used.</p><pre id="result">Running…</pre><button id="continue" hidden>Continue local verification</button><iframe title="Play analytics test game" src="about:blank"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),checks=[],$=id=>frame.contentDocument?.getElementById(id),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)),owner='11111111-1111-4111-8111-111111111111';
const assert=(condition,message)=>{if(!condition)throw Error(message);};async function until(fn,message){for(let n=0;n<800;n++){if(await fn())return;await pause(25);}throw Error(message);}
async function request(action,body={}){const response=await fetch('/__time-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountId:owner,...body})});const value=await response.json();if(!response.ok)throw Error(value.error);return value;}
function record(text){checks.push(text);out.textContent='Running…\n'+checks.join('\n');}
const original=Object.keys(localStorage).filter(k=>k.startsWith('brick-breaker-')).map(k=>[k,localStorage.getItem(k)]);
try{
 for(const [key]of original)localStorage.removeItem(key);localStorage.setItem('brick-breaker-help-seen-v1','true');await request('qa-reset',{milliseconds:60000});await request('qa-metrics-experiment',{active:true});
 const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/__time-game';await loaded;await until(()=>$('homePlay')&&!$('homePlay').disabled,'Game boot failed');assert($('metricsSwitch').disabled,'Guest analytics control should require sign-in');assert(!(await request('qa-metrics-events')).length,'Guest activity was uploaded');record('Guest manual play remains available; no anonymous activity is uploaded');
 $('homeAccount').click();$('accountEmail').value='time-test@example.test';$('signInForm').requestSubmit();await until(()=>!$('codePanel').hidden,'Code panel missing');$('accountCode').value='12345678';$('verifyForm').requestSubmit();await until(()=>!$('signedInPanel').hidden&&!$('homePlay').disabled&&$('accountMessage').textContent.includes('Signed in.'),'Sign-in did not finish');frame.contentDocument.querySelector('#account [data-close]').click();$('settings').click();await until(()=>!$('metricsSwitch').disabled,'Metrics preference did not load');assert($('metricsSwitch').getAttribute('aria-checked')==='false','Analytics were not off by default');assert(!(await request('qa-metrics-events')).length,'Events collected before opt-in');
 $('metricsSwitch').click();await until(()=>$('metricsSwitch').getAttribute('aria-checked')==='true'&&!$('metricsSwitch').disabled,'Opt-in did not finish');const snapshot=await request('metrics-state');assert(snapshot.enabled&&snapshot.assignment,'Configured experiment assignment missing');assert((await request('qa-metrics-events')).length===0,'Assignment was counted as an exposure');record('Explicit opt-in is reflected by the actual switch; assignment alone is not a visible exposure');
 $('metricsSwitch').scrollIntoView({block:'center'});
 if(new URL(location.href).searchParams.has('review')){const button=document.querySelector('#continue');button.hidden=false;await new Promise(resolve=>button.onclick=resolve);button.hidden=true;}
 $('closeMenu').click();$('homeHelp').click();frame.contentDocument.querySelector('#help [data-close]').click();$('homePlay').click();await until(()=>$('home').hidden&&!frame.contentDocument.querySelector('dialog[open]')&&$('splash').hidden,'Game not visible');await pause(350);assert($('promptText').textContent.includes(snapshot.assignment.variant==='aim_hint'?'Centre hits':'Grow the swarm'),'Chosen coaching copy does not match account assignment');frame.contentWindow.dispatchEvent(new Event('pagehide'));await until(async()=>{const events=await request('qa-metrics-events');return events.some(e=>e.type==='coach_exposure')&&events.some(e=>e.type==='help_open');},'Actual help/coaching exposure was not collected');record('Visible stage-one copy follows the account assignment; help and viewable coaching events reach PostgreSQL');
 $('launch').click();await until(()=>$('prompt').hidden,'Game did not launch');await pause(180);$('pause').click();frame.contentWindow.dispatchEvent(new Event('pagehide'));await until(async()=>(await request('qa-metrics-events')).some(e=>e.type==='play_segment'&&e.data.mode==='manual'&&e.data.activeMs>0),'Manual activity segment missing');record('Real app simulation records a separate manual play segment and stops it on pause');
 $('goHome').click();if($('homeConfirm').open)$('confirmHome').click();await until(()=>!$('home').hidden,'Home not reached');$('settings').click();await until(()=>!$('metricsSwitch').disabled,'Settings did not refresh');$('metricsSwitch').click();await until(()=>$('metricsSwitch').getAttribute('aria-checked')==='false'&&!$('metricsSwitch').disabled,'Opt-out did not finish');assert(!(await request('qa-metrics-events')).length,'Opt-out did not delete optional activity');const journal=JSON.parse(localStorage.getItem('brick-breaker-metrics-v1:user:'+owner));assert(journal.events.length===0,'Local optional queue survived opt-out');const before=frame.contentWindow.timeQA.calls.filter(call=>call.action==='metrics-collect').length;$('settingsHelp').click();frame.contentWindow.dispatchEvent(new Event('pagehide'));await pause(100);assert(frame.contentWindow.timeQA.calls.filter(call=>call.action==='metrics-collect').length===before,'Disabled analytics sent activity');assert(!(await request('qa-metrics-events')).length,'Disabled analytics reappeared');record('Opt-out removes server and queued activity; later help/background events do not recreate it');
 out.textContent='PASS · '+checks.length+' grouped checks\n\n'+checks.join('\n');out.dataset.state='pass';
}catch(error){out.textContent='FAIL: '+error.message+'\n'+checks.join('\n');out.dataset.state='fail';}
finally{const unloaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='about:blank';await unloaded;for(const key of Object.keys(localStorage))if(key.startsWith('brick-breaker-'))localStorage.removeItem(key);for(const [key,value]of original)localStorage.setItem(key,value);}
</script>
